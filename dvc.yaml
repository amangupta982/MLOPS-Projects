stages:
  data_ingestion:
    cmd: python3 src/data_ingestion.py
    deps:
      - src/data_ingestion.py
    outs:
      - data/raw

  data_preprocessing:
    cmd: python3 src/data_preprocessing.py
    deps:
      - src/data_preprocessing.py
      - data/raw/tweets.csv
    outs:
      - data/interim/cleaned_tweets.csv

  feature_engineering:
    cmd: python3 src/feature_engineering.py
    deps:
      - src/feature_engineering.py
      - data/interim/cleaned_tweets.csv
    outs:
      - data/processed/train_data.pkl
      - data/processed/test_data.pkl
      - data/processed/tfidf_vectorizer.pkl

  model_building:
    cmd: python3 src/model_building.py
    deps:
      - src/model_building.py
      - data/processed/train_data.pkl
    outs:
      - models/sentiment_model.pkl

  model_evaluation:
    cmd: python3 src/model_evaluation.py
    deps:
      - src/model_evaluation.py
      - data/processed/test_data.pkl
      - models/sentiment_model.pkl
    metrics:
      - metrics/scores.json:
          cache: false
